apiVersion: v1
kind: Tool
metadata:
  name: fus_send_message
  label: {en_US: Send fus text message, zh_Hans: 发送 Fus 文字消息}
  description: {en_US: Validate a structured reply and send exactly one plain-text message., zh_Hans: 校验结构化回复并发送一条普通文字消息。}
spec:
  parameters:
    type: object
    properties:
      route_token:
        type: string
        description: Copy route_token from the CURRENT FUS_DELIVERY_CONTEXT at the end of request history. Never copy a historical tool-call token.
      location:
        type: string
        description: Short scene location, one line.
      scene_time:
        type: string
        description: Current fictional scene time, one line; do not confuse it with actual wall-clock time.
      body:
        type: string
        description: Non-explicit adult dialogue and narration. Meet this turn's fus_minimum_cjk count in actual Chinese body characters, excluding header and status. Do not pad by repeating sentences. Omit status fields and choices here.
      mood:
        type: string
        description: Short non-explicit mood description, one line.
      relationship_value:
        type: integer
        minimum: 0
        maximum: 100
        description: Neutral relationship warmth from 0 to 100.
      options:
        type: array
        minItems: 4
        maxItems: 4
        items: {type: string}
        description: Exactly four different non-explicit next-scene choices; the host labels them A-D.
      brief_note:
        type: string
        description: At most 200 characters of visible scene context. No hidden reasoning, analysis transcript or tool-operation status.
    required: [route_token, location, scene_time, body, mood, relationship_value, options, brief_note]
    additionalProperties: false
  llm_prompt: |
    This tool is the only delivery channel for fus. It sends a plain-text message
    with header, body, mood, neutral relationship score, A-D choices and brief note.
    Complete all required fields. On validation_error, fix the reported problem
    and call again with the SAME current route_token; nothing has been sent yet.
    On stale_route, nothing was sent by that call: replace route_token with the
    token in the CURRENT FUS_DELIVERY_CONTEXT and call again with current fields.
    On invalid_or_expired_route with repair_allowed, replace an old or mistyped
    token with the CURRENT FUS_DELIVERY_CONTEXT token. If that current token was
    rejected or is unavailable, stop instead of guessing or repeatedly retrying.
    On sent or already_sent, stop immediately and output no assistant summary. On uncertain,
    sending or any error without repair_allowed, do not retry. Do not call a different tool or
    fall back to a normal assistant response. The destination is fixed by the host.
execution:
  python:
    path: fus_send_message.py
    attr: FusSendMessage
